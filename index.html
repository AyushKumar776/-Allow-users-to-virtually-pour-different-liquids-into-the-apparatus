<!DOCTYPE html>
<html>
<head>
  <title>REAL 3D Viscosity Lab - Final Clean Code</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    #ui{
      position:fixed; top:8px; left:8px; z-index:100;
      font-family:Arial,sans-serif; color:#fff; font-size:18px;
      background:rgba(0,0,0,0.9); padding:15px; border-radius:10px;
    }
    button{
      padding:12px 20px; margin:5px; background:#4CAF50; color:white;
      border:none; border-radius:8px; cursor:pointer;
    }
    button:hover{ background:#45a049; }
    button.active{ background:#ff9800; }
  </style>
</head>
<body>
  <a-scene background="color:#87CEEB">
    <!-- CAMERA: WASD + mouse drag -->
    <a-entity id="rig" position="0 1.6 6" wasd-controls="acceleration: 20">
      <a-entity 
        camera
        position="0 0 0"
        look-controls="pointerLockEnabled: false; mouseEnabled: true; touchEnabled: true">
      </a-entity>
    </a-entity>

    <!-- LIGHTS -->
    <a-light type="ambient" color="#404040" intensity="0.5"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.0" position="-1 3 2"></a-light>

    <!-- EXPERIMENT TABLE (CENTER) -->
    <a-entity id="exp-table" position="0 0 0">
      <a-box id="exp-table-top"
             position="0 1.1 0"
             width="6"
             depth="4"
             height="0.18"
             material="color:#8b4513; roughness:0.6; metalness:0.15"
             shadow="cast:true; receive:true">
      </a-box>

      <a-cylinder position="-2.5 0.2 -1.8" radius="0.18" height="1.8"
                  material="color:#5d4037" shadow="cast:true"></a-cylinder>
      <a-cylinder position=" 2.5 0.2 -1.8" radius="0.18" height="1.8"
                  material="color:#5d4037" shadow="cast:true"></a-cylinder>
      <a-cylinder position="-2.5 0.2  1.8" radius="0.18" height="1.8"
                  material="color:#5d4037" shadow="cast:true"></a-cylinder>
      <a-cylinder position=" 2.5 0.2  1.8" radius="0.18" height="1.8"
                  material="color:#5d4037" shadow="cast:true"></a-cylinder>
    </a-entity>

    <!-- BOTTLES: TABLE LEFT PE -->
    <a-entity id="bottles" position="-2 0 0">
      <a-entity id="water-bottle" class="bottle" position="-1 1.6 0">
        <a-cylinder position="0 0 0" radius="0.12" height="0.8"
                    material="color:#e0f0ff; transparent:true; opacity:0.4"></a-cylinder>
        <a-cylinder position="0 -0.25 0" radius="0.1" height="0.5"
                    material="color:#00bfff; transparent:true; opacity:0.9"></a-cylinder>
        <a-text value="WATER" position="0 0.55 0.2" color="#000" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <a-entity id="oil-bottle" class="bottle" position="0 1.6 0">
        <a-cylinder position="0 0 0" radius="0.12" height="0.8"
                    material="color:#fff0e0; transparent:true; opacity:0.4"></a-cylinder>
        <a-cylinder position="0 -0.25 0" radius="0.1" height="0.5"
                    material="color:#ff8c00; transparent:true; opacity:0.8"></a-cylinder>
        <a-text value="OIL" position="0 0.55 0.2" color="#000" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <a-entity id="glycerin-bottle" class="bottle" position="1 1.6 0">
        <a-cylinder position="0 0 0" radius="0.12" height="0.8"
                    material="color:#f0f0f0; transparent:true; opacity:0.4"></a-cylinder>
        <a-cylinder position="0 -0.25 0" radius="0.1" height="0.5"
                    material="color:#daa520; transparent:true; opacity:0.9"></a-cylinder>
        <a-text value="GLYCERIN" position="0 0.55 0.2" color="#000" scale="0.5 0.5 0.5"></a-text>
      </a-entity>
    </a-entity>

    <!-- ROTATING CYLINDER: TABLE CENTER PE -->
    <a-entity id="apparatus" position="0 0 0">
      <a-cylinder position="0 1.26 0" radius="0.3" height="0.12"
                  material="color:#c0c0c0; metalness:0.8"></a-cylinder>

      <a-cylinder id="fluid-container" position="0 1.86 0" radius="0.25" height="1.2"
                  material="color:#4682b4; transparent:true; opacity:0.4"></a-cylinder>

      <a-cylinder id="inner-cylinder" position="0 1.66 0" radius="0.18" height="0.8"
                  material="color:#808080"></a-cylinder>
    </a-entity>

    <!-- FLOOR -->
    <a-plane position="0 -0.7 0" rotation="-90 0 0" width="20" height="20"
             material="color:#696969"></a-plane>
  </a-scene>

  <!-- CLEAN UI: ONLY BUTTONS, NO EXTRA TEXT -->
  <div id="ui">
    <button id="water-btn" class="active">💧 WATER</button>
    <button id="oil-btn">🛢️ OIL</button>
    <button id="glycerin-btn">🥛 GLYCERIN</button>
  </div>

  <script>
    const liquids = {
      water: {color: '#00bfff'},
      oil:   {color: '#ff8c00'},
      glycerin: {color: '#daa520'}
    };

    function createDrop(fromX, liquidColor){
      const drop = document.createElement('a-sphere');
      drop.setAttribute('radius','0.015');
      drop.setAttribute('material',`color:${liquidColor}`);
      drop.setAttribute('position',`${fromX} 2.2 0`);
      drop.setAttribute('animation','property: position; to: 0 1.8 0; dur: 400; easing: ease-in');
      document.querySelector('a-scene').appendChild(drop);
      setTimeout(()=>{ drop.remove(); },400);
    }

    document.querySelectorAll('.bottle, button').forEach(el=>{
      el.addEventListener('click',()=>{
        const key = el.id.includes('water') ? 'water' :
                   el.id.includes('oil')   ? 'oil'   : 'glycerin';
        document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        if(el.tagName === 'BUTTON') el.classList.add('active');

        const bottlePos = el.classList.contains('bottle')
          ? el.getAttribute('position').split(' ')
          : ['0','0','0'];
        const fromX = parseFloat(bottlePos[0]);
        createDrop(fromX, liquids[key].color);

        document.getElementById('fluid-container')
          .setAttribute('material',
            `color:${liquids[key].color}; transparent:true; opacity:0.4`);
      });
    });

    function rotateCylinder(){
      document.getElementById('inner-cylinder').object3D.rotation.y += 0.02;
      requestAnimationFrame(rotateCylinder);
    }
    rotateCylinder();
  </script>
</body>
</html>
